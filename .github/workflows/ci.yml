name: CI RecargaYa

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync

      - name: Pruebas unitarias TDD
        run: uv run pytest tests/tdd/test_recargas.py -v

      - name: Pruebas de API
        run: uv run pytest tests/test_api.py -v

      - name: Pruebas BDD
        run: uv run pytest tests/bdd/steps/ -v

  performance:
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync

      - name: Iniciar API en background
        run: uv run uvicorn src.app:app --host 0.0.0.0 --port 8000 &

      - name: Esperar arranque
        run: sleep 4

      - name: Locust headless
        run: |
          uv run locust -f tests/locust/locustfile.py \
            --headless --users 30 --spawn-rate 5 \
            --run-time 30s --host http://localhost:8000 \
            --csv=resultados --exit-code-on-error 1

      - name: Verificar P95 menor a 300ms
        run: |
          python -c "
          import csv
          with open('resultados_stats.csv') as f:
              for row in csv.DictReader(f):
                  if row['Name'] == 'Aggregated':
                      p95 = float(row['95%'])
                      assert p95 < 300, f'FALLO: P95={p95}ms'
                      print(f'OK: P95={p95}ms')
          "